<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ASTRALIS</title><link rel="preconnect" href="https://fonts.googleapis.com" crossorigin="anonymous"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"><link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;600&family=Orbitron:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" crossorigin="anonymous"><link rel="stylesheet" href="/css/global.css"><link rel="stylesheet" href="/css/landing.css"></head><body>
<main class="landing-shell"><section class="landing-header"><h1 class="logo">ASTRALIS</h1><p class="tagline">REAL-TIME INTELLIGENCE FROM BEYOND</p><div class="draw-line"></div><div class="landing-clock mono" id="landingClock"></div></section><section class="card-grid" id="cardGrid"></section></main>
<script type="module">
import { initBackground, initLoadUI, startUTCClock } from '/js/config.js';
initLoadUI();initBackground();startUTCClock(document.getElementById('landingClock'));document.getElementById('bootOverlay')?.classList.add('hide');
const cards=[['✦','APOD','Daily astronomy image/video with date picker.','/pages/apod.html'],['☀','SPACE WEATHER','Latest DONKI flare activity.','/pages/space-weather.html'],['☄','ASTEROID WATCH','Today\'s closest NEO danger feed.','/pages/asteroids.html'],['🌍','EARTH EVENTS','Open natural events map.','/pages/earth-events.html'],['📡','NASA MEDIA','NASA image/video archive search.','/pages/media.html'],['🛰','ISS TRACKER','Live ISS map and crew count.','/pages/iss.html'],['🔴','MARS GALLERY','Curiosity latest photos + camera filter.','/pages/mars.html']];
const grid=document.getElementById('cardGrid');cards.forEach(([i,t,d,l],x)=>{const a=document.createElement('a');a.className='nav-card';a.href=l;a.style.animationDelay=`${(x+1)*.08}s`;a.innerHTML=`<div class="card-icon">${i}</div><h3 class="card-title">${t}</h3><p class="card-desc">${d}</p>`;grid.appendChild(a);});
</script></body></html>
